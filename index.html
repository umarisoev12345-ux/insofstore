<style>
:root{--bg:#f6f0eb;--card:#fff;--tx:#2b1515;--mu:#8b7674;--br:#4f2222;--br2:#6d2c2c;--gold:#d4ae6a;--bd:#eadfd8;--red:#c8243c;--ok:#1d8a52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0c0c;--card:#2a1515;--tx:#f6ece6;--mu:#bba5a2;--bd:#402424;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a0c0c;--card:#2a1515;--tx:#f6ece6;--mu:#bba5a2;--bd:#402424;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);padding-bottom:78px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--br);z-index:150}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--br);padding:10px 14px 12px}
.w{max-width:1180px;margin:0 auto}
.r1{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--gold);flex:none;object-fit:cover}
.wm{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:20px;font-weight:700;color:#fff;letter-spacing:-.5px;flex:1}.wm i{color:var(--gold);font-style:normal}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:2px}.lang button{background:none;border:0;padding:6px 10px;color:#e8d5d0;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer}.lang button.on{background:var(--gold);color:var(--br)}
.adm{display:none;background:var(--gold);color:var(--br);border:0;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
.sb{display:flex;background:#fff;border-radius:12px;overflow:hidden;border:2px solid var(--gold)}
.sb input{flex:1;border:0;outline:0;padding:11px 14px;font-size:14px;background:none;color:#2b1515;min-width:0}.sb span{padding:0 14px;display:flex;align-items:center;background:var(--gold);color:var(--br)}
main{max-width:1180px;margin:0 auto;padding:14px}
.cats{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}.cats::-webkit-scrollbar{display:none}
.ct{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;min-width:64px;font-size:12px;color:var(--mu)}
.ct i{width:58px;height:58px;border-radius:50%;background:var(--card);border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:26px;font-style:normal}
.ct.on{color:var(--br);font-weight:700}.ct.on i{border-color:var(--br);background:var(--br)}
:root[data-theme="dark"] .ct.on,.dk .ct.on{color:var(--gold)}
.hero{border-radius:16px;overflow:hidden;margin-bottom:12px;background:var(--br);position:relative}.hero img{width:100%;display:block}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pk{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center;font-size:11px;line-height:1.3}.pk b{display:block;font-size:20px;margin-bottom:2px}
.tool{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--mu)}
.tool select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:960px){.grid{grid-template-columns:repeat(5,1fr);gap:14px}}
.card{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;border:1px solid var(--bd)}
.im{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,#f3e6dc,#e8d3c6);display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.im img,.im video{width:100%;height:100%;object-fit:cover}
.bs{position:absolute;left:8px;bottom:8px;display:flex;gap:4px;flex-wrap:wrap}
.bs b{font-size:11px;padding:3px 7px;border-radius:7px;color:#fff;background:var(--red)}.bs b.h{background:var(--br)}.bs b.n{background:var(--ok)}
.hf{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:16px;cursor:pointer;color:#999}.hf.on{color:var(--red)}
.bd{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.pr b{font-size:18px;color:var(--tx)}.pr s{color:var(--mu);font-size:12px;margin-left:6px}.pr.sl b{color:var(--red)}
.nm{font-size:13px;line-height:1.3;height:34px;overflow:hidden;color:var(--tx)}
.rt{font-size:12px;color:var(--mu)}.rt b{color:#e0a100}
.ad{margin-top:auto;background:var(--br);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer;font-size:13px}
.st{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:3px}
.st button{width:34px;height:34px;border:0;border-radius:8px;background:var(--card);cursor:pointer;font-size:16px;font-weight:700}
.md{position:fixed;inset:0;background:rgba(20,6,6,.7);z-index:200;overflow-y:auto;backdrop-filter:blur(6px)}
.mc{background:var(--bg);max-width:900px;margin:0 auto;min-height:100%;padding:16px 16px 90px;position:relative}
@media(min-width:900px){.mc{margin:24px auto;min-height:0;border-radius:18px}}
.x{position:sticky;top:6px;float:right;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:18px;cursor:pointer;z-index:3}
.pg{display:grid;gap:16px}@media(min-width:760px){.pg{grid-template-columns:1fr 1fr}}
.mn{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:110px}.mn img,.mn video{width:100%;height:100%;object-fit:contain}
.th{display:flex;gap:8px;overflow-x:auto;margin-top:8px}.tb{width:60px;height:60px;border-radius:10px;overflow:hidden;border:2px solid var(--bd);flex:none;cursor:pointer;background:var(--card);display:flex;align-items:center;justify-content:center}.tb.on{border-color:var(--br)}.tb img,.tb video{width:100%;height:100%;object-fit:cover}
.pb{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;border:1px solid var(--bd)}
.big{font-size:28px;font-weight:800}.big s{font-size:15px;color:var(--mu);font-weight:400;margin-left:8px}
.tabs{display:flex;gap:6px;margin:12px 0 8px}.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:var(--card);cursor:pointer;font-weight:600;font-size:13px}.tabs button.on{background:var(--br);color:#fff}
table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px dashed var(--bd);font-size:13px;vertical-align:top}td:first-child{color:var(--mu);width:45%}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:220;justify-content:center}
.bar>*{max-width:420px}
.b{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--br);color:#fff;flex:1;font-size:14px}.b.g{background:var(--gold);color:var(--br)}.b.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.b.rd{background:var(--red)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:90}
.nl{background:none;border:0;color:var(--mu);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-width:64px}.nl i{font-style:normal;font-size:20px}.nl.on{color:var(--br)}
.nb{position:absolute;top:-3px;right:14px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;padding:0 4px;display:none;align-items:center;justify-content:center}
.ci{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px;font-size:13px}.ci .im{width:60px;aspect-ratio:1;border-radius:8px;font-size:28px;flex:none}
.in{width:100%;padding:11px;margin-bottom:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;outline:none;font-size:14px}
.so{display:block;padding:14px;border-radius:12px;margin-bottom:10px;text-decoration:none;color:#fff;font-weight:700}
.lb{font-size:12px;color:var(--mu);display:block;margin:6px 0 3px}
.ai{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;background:var(--card);font-size:13px}.ai button{background:none;border:0;cursor:pointer;font-size:16px}
.pv{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.pv span{width:50px;height:50px;border-radius:8px;overflow:hidden;border:1px solid var(--br);position:relative;display:flex;align-items:center;justify-content:center;background:var(--card)}.pv img{width:100%;height:100%;object-fit:cover}.pv a{position:absolute;top:0;right:3px;color:var(--red);text-decoration:none;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b1515;color:#fff;padding:10px 16px;border-radius:10px;z-index:300;font-size:13px}
.pbtn{background:none;border:0;color:#fff;font-size:20px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.hb{display:none;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;position:relative;white-space:nowrap}.hb .nb{right:-4px;top:-6px}
.pf{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold)}
@media(min-width:900px){.hb{display:inline-flex;align-items:center;gap:6px}.nav{display:none}body{padding-bottom:24px}.w{display:flex;align-items:center;gap:14px}.r1{display:contents}.av{order:1}.wm{order:2;flex:none}.sb{order:3;flex:1}.hb,.adm,.lang,.pbtn{order:4}.card{transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(79,34,34,.18)}.hero{max-height:260px}.hero img{object-fit:cover;max-height:260px}}
.stg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}@media(min-width:700px){.stg{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.sc b{display:block;font-size:22px}.sc span{font-size:12px;color:var(--mu)}
.ar{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px;font-size:13px;flex-wrap:wrap}.ar .im{width:56px;aspect-ratio:1;border-radius:10px;font-size:26px;flex:none}.ab{display:flex;gap:4px;margin-left:auto}.ab button{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:7px 9px;cursor:pointer;font-size:13px}
.cx{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--bg);margin-right:4px}.cx.off{background:#f3d4d8;color:var(--red)}.out{opacity:.55}
.sk{height:270px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.fg{display:grid;gap:10px}@media(min-width:700px){.fg{grid-template-columns:1fr 1fr}}.fs{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.fs .in{background:var(--bg)}
</style>

  modal(`<div class="pg"><div><div class="mn" id="mn">${m[0]?(isVid(m[0])?`<video src="${esc(m[0])}" controls playsinline></video>`:`<img src="${esc(m[0])}" alt="">`):esc(p.emoji||'📦')}</div>${m.length>1?`<div class="th">${m.map((u,i)=>`<div class="tb ${i?'':'on'}" data-i="${i}">${med(u)}</div>`).join('')}</div>`:''}</div>
  <div><h2 style="font-size:19px;line-height:1.3">${esc(L(p,'tr','tt'))}</h2><div class="rt" style="margin:6px 0"><b>★</b> ${p.rating||5}</div>
  <div class="pb"><div class="big">${p.price} TJS${disc(p)?`<s>${p.old}</s>`:''}</div>${disc(p)?`<div style="color:var(--red);font-size:13px;font-weight:700">−${disc(p)}%</div>`:''}<div style="font-size:13px;color:var(--mu);margin-top:8px;line-height:1.7">🚚 ${t('p1')}<br>💵 ${t('p2')}<br>🛡️ ${t('p3')}</div></div>
  <div class="tabs"><button class="on" id="t1">${t('descr')}</button><button id="t2">${t('specs')}</button></div><div id="tc" style="font-size:14px;line-height:1.6">${esc(L(p,'dr','dt'))}</div></div></div>`,
  `<div class="bar"><b style="font-size:18px">${p.price} TJS</b><button class="b o" id="ca">${t('add')}</button><button class="b g" id="wo">${t('order')}</button></div>`);
  document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));b.classList.add('on');const u=m[+b.dataset.i];$('mn').innerHTML=isVid(u)?`<video src="${esc(u)}" controls playsinline></video>`:`<img src="${esc(u)}" alt="">`});
  $('t1').onclick=()=>{$('t1').className='on';$('t2').className='';$('tc').textContent=L(p,'dr','dt')};
  $('t2').onclick=()=>{$('t2').className='on';$('t1').className='';$('tc').innerHTML=rows.length?`<table>${rows.map(a=>`<tr><td>${esc(a[0].trim())}</td><td>${esc(a.slice(1).join(':').trim())}</td></tr>`).join('')}</table>`:'—'};
  $('ca').onclick=()=>add(id);$('wo').onclick=()=>wa(t('hello')+' '+L(p,'tr','tt')+' ('+p.price+' TJS)')}
function openCart(){const ids=Object.keys(cart).filter(find),tot=ids.reduce((a,i)=>a+find(i).price*cart[i],0);
  modal(`<h3 style="margin:8px 0 14px">🛒 ${t('cart')}</h3>`+(ids.length?ids.map(i=>{const p=find(i);return `<div class="ci"><div class="im">${med(p.media[0],p.emoji)}</div><div style="flex:1">${esc(L(p,'tr','tt'))}<br><b>${p.price*cart[i]} TJS</b></div><div class="st" style="width:104px"><button data-m="${i}">−</button><b>${cart[i]}</b><button data-p="${i}">+</button></div></div>`}).join('')+`<input class="in" id="on" placeholder="${t('nm')}" value="${esc(me.name)}"><input class="in" id="op" type="tel" placeholder="${t('ph')}" value="${esc(me.phone)}"><input class="in" id="ad" placeholder="${t('addr')}"><p style="font-size:18px;font-weight:800;margin:6px 0">${t('total')}: ${tot} TJS</p>`:`<p style="color:var(--mu)">${t('empty')}</p>`),
  ids.length?`<div class="bar"><button class="b g" id="go">${t('order')}</button></div>`:'');
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{add(b.dataset.m,-1);openCart()});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{add(b.dataset.p);openCart()});
  if($('go'))$('go').onclick=()=>{const n=$('on').value.trim(),ph=$('op').value.replace(/[\s-]/g,''),a=$('ad').value.trim();
    if(!n||!/^(\+?992)?[0-9]{9}$/.test(ph))return toast(t('badph'));const p='+992'+ph.slice(-9);
    try{db&&db.ref('orders').push({name:n,phone:p,addr:a,total:tot,date:Date.now(),status:'new',uid:me.uid||'',items:ids.map(i=>({id:i,n:L(find(i),'tr','tt'),q:cart[i],p:find(i).price}))})}catch(e){}
    wa(t('hello')+'\n'+ids.map(i=>'- '+L(find(i),'tr','tt')+' × '+cart[i]+' = '+find(i).price*cart[i]+' TJS').join('\n')+'\n'+t('total')+': '+tot+' TJS\n👤 '+n+'\n📞 '+p+(a?'\n📍 '+a:''));cart={};keep();close()}}
function openSoc(){modal(`<h3 style="margin:8px 0 14px">${t('soc')}</h3><a class="so" style="background:#229ED9" href="https://t.me/${TG}" target="_blank">✈️ Telegram (@${TG})</a><a class="so" style="background:#1fa855" href="https://wa.me/${PHONE}" target="_blank">💬 WhatsApp (+${PHONE})</a><a class="so" style="background:linear-gradient(135deg,#833AB4,#FD1D1D,#FCB045)" href="https://instagram.com/${IG}" target="_blank">📸 Instagram (@${IG})</a>`)}
/* ---------- Профиль, вход через Google, админ-панель ---------- */
let view='',atab='p',aq='',orders=[],ordRef=null,me={uid:'',name:'',phone:'',email:''};
const isAdm=()=>!!(auth&&auth.currentUser&&auth.currentUser.email===ADMIN_EMAIL);
function profile(){const u=auth&&auth.currentUser;
  modal(`<h3 style="margin:8px 0 14px">👤 ${t('prof')}</h3>`+(u?`<div class="pb" style="display:flex;gap:12px;align-items:center">${u.photoURL?`<img class="pf" src="${esc(u.photoURL)}" alt="">`:''}<div><b>${esc(u.displayName||'')}</b><div style="font-size:12px;color:var(--mu)">${esc(u.email)}</div></div></div><span class="lb">${t('ph')}</span><input class="in" id="mp" type="tel" value="${esc(me.phone)}"><button class="b" id="sp" style="width:100%;margin-bottom:8px">${t('save')}</button>${isAdm()?`<button class="b g" id="oa" style="width:100%;margin-bottom:8px">${t('openadm')}</button>`:''}<button class="b o" id="lo" style="width:100%">${t('logout')}</button>`:`<button class="b" id="gl" style="width:100%;padding:15px">G&nbsp; ${t('login')}</button>`));
  if(u){$('sp').onclick=()=>{const p=$('mp').value.replace(/[\s-]/g,'');if(!/^(\+?992)?[0-9]{9}$/.test(p))return toast(t('badph'));me.phone='+992'+p.slice(-9);db.ref('users/'+u.uid+'/phone').set(me.phone);toast('✓')};$('lo').onclick=()=>{auth.signOut();close()};if($('oa'))$('oa').onclick=admin}
  else $('gl').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(close).catch(e=>toast(e.code==='auth/unauthorized-domain'?'Добавьте домен сайта: Firebase → Authentication → Settings → Authorized domains':'Ошибка входа'))}
function admin(){if(!isAdm())return;view='admin';
  const avg=S.products.length?Math.round(S.products.reduce((a,p)=>a+p.price,0)/S.products.length):0,nw=orders.filter(o=>o.status==='new').length;
  const l=S.products.filter(p=>!aq||((p.tr||'')+' '+(p.tt||'')).toLowerCase().includes(aq.toLowerCase()));
  const body=atab==='p'?`<button class="b" id="nw" style="width:100%;margin-bottom:10px">➕ Новый товар</button><input class="in" id="as" placeholder="🔍 Поиск по товарам" value="${esc(aq)}">`+(l.map(p=>`<div class="ar ${p.hidden?'out':''}"><div class="im">${med(p.media[0],p.emoji)}</div><div style="flex:1;min-width:140px"><b>${esc(p.tr||p.tt)}</b><br>${p.price} TJS${disc(p)?` <s style="color:var(--mu)">${p.old}</s>`:''}<br><span class="cx">${esc(T.ru[p.cat])}</span>${p.hidden?'<span class="cx off">скрыт</span>':''}<span class="cx">остаток: ${p.stock==null?'∞':p.stock}</span></div><div class="ab"><button data-e="${p.id}" title="Изменить">✏️</button><button data-c="${p.id}" title="Дублировать">⧉</button><button data-h="${p.id}" title="Показать/скрыть">${p.hidden?'👁':'🙈'}</button><button data-d="${p.id}" title="Удалить">🗑️</button></div></div>`).join('')||'<p style="color:var(--mu)">Ничего нет</p>')
  :(orders.map(o=>`<div class="pb"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.name)} · ${esc(o.phone)}</b><span class="cx ${o.status==='new'?'off':''}">${o.status==='new'?'новый':'выполнен'}</span></div><div style="font-size:12px;color:var(--mu);margin:4px 0">${new Date(o.date).toLocaleString('ru-RU')}${o.addr?' · 📍 '+esc(o.addr):''}</div>${(o.items||[]).map(i=>`<div style="font-size:13px">• ${esc(i.n)} × ${i.q} = ${i.p*i.q} TJS</div>`).join('')}<div style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b style="flex:1">${o.total} TJS</b><button class="b o" data-o="${o.key}" style="flex:none;padding:7px 10px;font-size:12px">${o.status==='new'?'✓ Выполнен':'↩ В новые'}</button><button class="b o" data-x="${o.key}" style="flex:none;padding:7px 10px;font-size:12px">🗑️</button></div></div>`).join('')||'<p style="color:var(--mu)">Заказов пока нет</p>');
  modal(`<h2 style="margin:6px 0 14px">⚙️ Админ-панель</h2><div class="stg"><div class="sc"><b>${S.products.length}</b><span>Товаров</span></div><div class="sc"><b>${S.products.filter(p=>!p.hidden).length}</b><span>Видно покупателям</span></div><div class="sc"><b>${avg}</b><span>Средняя цена, TJS</span></div><div class="sc"><b>${nw}</b><span>Новых заказов</span></div></div><div class="tabs"><button class="${atab==='p'?'on':''}" id="tp">📦 Товары</button><button class="${atab==='o'?'on':''}" id="to">🧾 Заказы${nw?' ('+nw+')':''}</button></div>${body}`);
  $('tp').onclick=()=>{atab='p';admin()};$('to').onclick=()=>{atab='o';admin()};
  if($('nw'))$('nw').onclick=()=>{edit={id:'p'+Date.now(),cat:'audio',price:0,old:0,badge:'',rating:5,emoji:'📦',tr:'',tt:'',dr:'',dt:'',sr:'',st:'',media:[]};form()};
  if($('as'))$('as').oninput=e=>{aq=e.target.value;admin();const i=$('as');i.focus();i.setSelectionRange(99,99)};
  const on=(a,f)=>document.querySelectorAll('['+a+']').forEach(b=>b.onclick=()=>f(b.getAttribute(a)));
  on('data-e',k=>{edit=JSON.parse(JSON.stringify(find(k)));form()});
  on('data-c',k=>{edit=JSON.parse(JSON.stringify(find(k)));edit.id='p'+Date.now();edit.tr+=' (копия)';edit.hidden=true;form()});
  on('data-h',k=>db.ref('products/'+k+'/hidden').set(!find(k).hidden));
  on('data-d',k=>{if(confirm('Удалить товар навсегда?'))db.ref('products/'+k).remove()});
  on('data-o',k=>{const o=orders.find(x=>x.key===k);db.ref('orders/'+k+'/status').set(o.status==='new'?'done':'new')});
  on('data-x',k=>{if(confirm('Удалить заказ?'))db.ref('orders/'+k).remove()})}
function collect(){const g=i=>$(i).value;const k=g('fk');Object.assign(edit,{tr:g('ft'),tt:g('ftj'),price:+g('fp')||0,old:+g('fo')||0,stock:k===''?null:Math.max(0,+k||0),hidden:$('fh').checked,cat:g('fc'),badge:g('fb'),dr:g('fd'),dt:g('fdt'),sr:g('fs'),st:g('fst'),emoji:g('fe')||'📦'});const v=g('fv').trim();if(v&&!edit.media.includes(v))edit.media.push(v);$('fv').value=''}
function form(){view='form';const isNew=!S.products.some(p=>p.id===edit.id),sel=(id,arr,cur)=>`<select class="in" id="${id}">${arr.map(a=>`<option value="${a[0]}" ${a[0]===cur?'selected':''}>${a[1]}</option>`).join('')}</select>`;
  modal(`<h2 style="margin:6px 0 12px">${isNew?'➕ Новый товар':'✏️ Редактирование'}</h2><div class="fg">
  <div class="fs"><span class="lb">Название</span><input class="in" id="ft" placeholder="Русский" value="${esc(edit.tr)}"><input class="in" id="ftj" placeholder="Тоҷикӣ" value="${esc(edit.tt)}"><span class="lb">Категория и ярлык</span><div style="display:flex;gap:8px">${sel('fc',['watch','audio','power','other'].map(c=>[c,T.ru[c]]),edit.cat)}${sel('fb',[['','Без ярлыка'],['hit','Хит'],['new','Новинка']],edit.badge)}</div></div>
  <div class="fs"><span class="lb">Цена · старая цена (для скидки) · остаток</span><div style="display:flex;gap:8px"><input class="in" id="fp" type="number" min="0" value="${edit.price}"><input class="in" id="fo" type="number" min="0" value="${edit.old||0}"><input class="in" id="fk" type="number" min="0" placeholder="∞" value="${edit.stock==null?'':edit.stock}"></div><label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 8px"><input type="checkbox" id="fh" ${edit.hidden?'checked':''}> Скрыть от покупателей</label><span class="lb">Эмодзи, если нет фото</span><input class="in" id="fe" value="${esc(edit.emoji)}"></div>
  <div class="fs"><span class="lb">Описание</span><textarea class="in" id="fd" rows="4" placeholder="Русский">${esc(edit.dr)}</textarea><textarea class="in" id="fdt" rows="4" placeholder="Тоҷикӣ">${esc(edit.dt)}</textarea></div>
  <div class="fs"><span class="lb">Характеристики, по строке: Название: значение</span><textarea class="in" id="fs" rows="4" placeholder="Русский">${esc(edit.sr)}</textarea><textarea class="in" id="fst" rows="4" placeholder="Тоҷикӣ">${esc(edit.st)}</textarea></div>
  <div class="fs" style="grid-column:1/-1"><span class="lb">Фото (первое — главное, нажмите на фото, чтобы сделать главным)</span><input class="in" type="file" id="fm" accept="image/*" multiple><div class="pv">${edit.media.map((u,i)=>`<span data-k="${i}">${isVid(u)?'🎬':`<img src="${esc(u)}" alt="">`}<a href="#" data-r="${i}">✕</a></span>`).join('')}</div><input class="in" id="fv" placeholder="Ссылка на видео .mp4 (по желанию)"></div></div>`,
  `<div class="bar"><button class="b o" id="bk">Назад</button><button class="b" id="sv">Сохранить</button></div>`);
  $('bk').onclick=admin;
  $('fm').onchange=async()=>{collect();toast('Загрузка…');try{for(const f of $('fm').files)edit.media.push(await shrink(f))}catch(e){toast('Ошибка загрузки')}form()};
  document.querySelectorAll('[data-k]').forEach(s=>s.onclick=()=>{collect();const i=+s.dataset.k;edit.media.unshift(edit.media.splice(i,1)[0]);form()});
  document.querySelectorAll('[data-r]').forEach(a=>a.onclick=e=>{e.preventDefault();e.stopPropagation();collect();edit.media.splice(+a.dataset.r,1);form()});
  $('sv').onclick=()=>{collect();if(!(edit.tr||edit.tt)||!edit.price)return toast('Укажите название и цену');const id=edit.id,o=JSON.parse(JSON.stringify(edit));delete o.id;db.ref('products/'+id).set(o).then(()=>{toast('Сохранено ✓');atab='p';admin()},()=>toast('Нет доступа'))}}
const shrink=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
$('q').oninput=e=>{query=e.target.value;grid()};$('so').onchange=e=>{sort=e.target.value;grid()};
$('lru').onclick=()=>setL('ru');$('ltj').onclick=()=>setL('tj');
function setL(l){lang=l;try{localStorage.setItem('is_lang',l)}catch(e){}ui()}
$('n1').onclick=()=>{favOnly=false;close();ui();scrollTo({top:0,behavior:'smooth'})};$('n4').onclick=()=>{favOnly=true;close();ui();scrollTo({top:0,behavior:'smooth'})};$('n2').onclick=openCart;$('n3').onclick=openSoc;$('adm').onclick=admin;
$('hf').onclick=()=>$('n4').onclick();$('hc').onclick=openCart;$('hp').onclick=profile;
const ADMIN_EMAIL='umarisoev12345@gmail.com';let db=null,auth=null;
ui();keep();$('grid').innerHTML=Array(6).fill('<div class="sk"></div>').join('');
try{firebase.initializeApp({apiKey:"AIzaSyD0-O2Hq-P9zeRzcExwQ9OZ43xUMR0IwHQ",authDomain:"insofstore-a2a18.firebaseapp.com",databaseURL:"https://insofstore-a2a18-default-rtdb.firebaseio.com",projectId:"insofstore-a2a18",appId:"1:866226161465:web:cc004285c0e207245b0ae8"});
  db=firebase.database();auth=firebase.auth();
  db.ref('products').on('value',s=>{const v=s.val()||{};S.products=Object.keys(v).map(k=>({...v[k],id:k,media:v[k].media||[]}));ui();if(view==='admin')admin()},()=>{S.products=SEED;ui()});
  auth.onAuthStateChanged(u=>{me={uid:u?u.uid:'',name:u&&u.displayName||'',phone:me.phone,email:u?u.email:''};
    $('hp').innerHTML=u&&u.photoURL?`<img class="pf" src="${esc(u.photoURL)}" alt="">`:'👤';$('adm').style.display=isAdm()?'block':'none';
    if(ordRef){ordRef.off();ordRef=null;orders=[]}
    if(isAdm()){ordRef=db.ref('orders').orderByChild('date').limitToLast(100);ordRef.on('value',s=>{orders=[];s.forEach(c=>{orders.unshift({...c.val(),key:c.key})});if(view==='admin')admin()})}
    if(u)db.ref('users/'+u.uid+'/phone').once('value',s=>{if(s.val())me.phone=s.val()})})}catch(e){S.products=SEED;ui()}
</script>
