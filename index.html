function collect(){const g=i=>$(i).value;const k=g('fk');Object.assign(edit,{tr:g('ft'),tt:g('ftj'),price:+g('fp')||0,old:+g('fo')||0,stock:k===''?null:Math.max(0,+k||0),hidden:$('fh').checked,cat:g('fc'),badge:g('fb'),sub:g('fs2'),dr:g('fd'),dt:g('fdt'),sr:g('fs'),st:g('fst'),emoji:g('fe')||'📦'});const v=g('fv').trim();if(v&&!edit.media.includes(v))edit.media.push(v);$('fv').value=''}

const shrink=(f,mx=800,q=.7)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
